# Vérification automatique : à chaque PR et à chaque fusion sur main,
# GitHub vérifie que le code se tient (types) et que le calcul donne
# toujours les mêmes résultats (tests). Une croix rouge sur la PR = ne pas fusionner.
name: Vérification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npx tsc --noEmit
      - name: Tester le moteur de calcul et les montants
        run: npm test
